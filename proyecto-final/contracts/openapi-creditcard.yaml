openapi: 3.0.3
info:
  title: Bank Credit Card API
  description: >
    API de gestion de tarjetas de credito. Contrato API-first del proyecto final:
    la implementacion (Spring Boot) sigue este contrato y usa andes-api-server-spring-boot-starter
    para el envelope estandar {success, data, error, metadata}, correlation id y manejo de errores.
  version: 1.0.0
  contact:
    name: Galaxy Training - Proyecto Final
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: CreditCards
    description: Emision y consulta de tarjetas de credito
  - name: Transactions
    description: Autorizacion y consulta de transacciones de una tarjeta

paths:
  /api/v1/credit-cards:
    post:
      operationId: issueCreditCard
      tags: [CreditCards]
      summary: Emite una nueva tarjeta de credito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCardRequest' }
      responses:
        '201':
          description: Tarjeta emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditCardEnvelope' }
        '422':
          description: Error de validacion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/credit-cards/{cardId}:
    get:
      operationId: getCreditCard
      tags: [CreditCards]
      summary: Consulta una tarjeta por id (numero/CVV enmascarados)
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Tarjeta encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditCardEnvelope' }
        '404':
          description: No existe la tarjeta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/credit-cards/{cardId}/status:
    patch:
      operationId: updateCreditCardStatus
      tags: [CreditCards]
      summary: Bloquea o cancela una tarjeta
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardStatusUpdateRequest' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditCardEnvelope' }
        '409':
          description: Transicion de estado invalida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/credit-cards/{cardId}/transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: Lista las transacciones de una tarjeta
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Listado de transacciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionListEnvelope' }
    post:
      operationId: authorizeTransaction
      tags: [Transactions]
      summary: Autoriza una transaccion (compra/pago/reembolso) contra un servicio de fraude
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '201':
          description: Transaccion procesada (aprobada o rechazada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionEnvelope' }
        '404':
          description: No existe la tarjeta
        '409':
          description: Tarjeta no activa
        '422':
          description: Limite de credito insuficiente

components:
  schemas:
    IssueCardRequest:
      type: object
      required: [cardHolderName, cardNumber, cvv, expirationMonth, expirationYear, creditLimit]
      properties:
        cardHolderName: { type: string, example: Ana Lopez }
        cardNumber: { type: string, example: "4111111111111111" }
        cvv: { type: string, example: "123" }
        expirationMonth: { type: integer, example: 12 }
        expirationYear: { type: integer, example: 2030 }
        creditLimit: { type: number, example: 5000 }

    CardStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, BLOCKED, CANCELLED] }

    CreditCard:
      type: object
      properties:
        id: { type: integer, format: int64 }
        cardHolderName: { type: string }
        cardNumber: { type: string, description: "Enmascarado, p. ej. ************1111" }
        cvv: { type: string, description: "Enmascarado, p. ej. ***" }
        expirationMonth: { type: integer }
        expirationYear: { type: integer }
        creditLimit: { type: number }
        availableBalance: { type: number }
        status: { type: string, enum: [ACTIVE, BLOCKED, CANCELLED] }
        createdAt: { type: string, format: date-time }

    TransactionRequest:
      type: object
      required: [merchant, amount, type]
      properties:
        merchant: { type: string, example: "Amazon" }
        amount: { type: number, example: 250.50 }
        type: { type: string, enum: [PURCHASE, PAYMENT, REFUND] }

    Transaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        cardId: { type: integer, format: int64 }
        merchant: { type: string }
        amount: { type: number }
        type: { type: string, enum: [PURCHASE, PAYMENT, REFUND] }
        status: { type: string, enum: [APPROVED, REJECTED] }
        fraudScore: { type: integer }
        createdAt: { type: string, format: date-time }

    ApiMetadata:
      type: object
      properties:
        traceId: { type: string }
        correlationId: { type: string }
        requestId: { type: string }

    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        httpStatus: { type: integer }

    CreditCardEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/CreditCard' }
        error: { $ref: '#/components/schemas/ApiError' }
        metadata: { $ref: '#/components/schemas/ApiMetadata' }

    TransactionEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Transaction' }
        error: { $ref: '#/components/schemas/ApiError' }
        metadata: { $ref: '#/components/schemas/ApiMetadata' }

    TransactionListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        error: { $ref: '#/components/schemas/ApiError' }
        metadata: { $ref: '#/components/schemas/ApiMetadata' }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true }
        error: { $ref: '#/components/schemas/ApiError' }
        metadata: { $ref: '#/components/schemas/ApiMetadata' }
