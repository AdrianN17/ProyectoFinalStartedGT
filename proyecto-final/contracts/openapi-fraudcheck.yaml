openapi: 3.0.3
info:
  title: Fraud Check API (External)
  description: >
    Contrato de la API externa de scoring de fraude consumida por este proyecto a traves
    del cliente nombrado "fraudCheck" (andes-api-client-spring-boot-starter). Es el segundo
    contrato del proyecto (el primero es contracts/openapi-creditcard.yaml, que este servicio
    expone como servidor): este describe la API que el servicio de terceros debe implementar
    y que aqui se consume como cliente.

    En este repositorio, el contrato se cumple de dos formas intercambiables:
      1. FraudCheckSimulatorController (Java, en el mismo proceso) - para que el proyecto
         sea autocontenido sin depender de un tercero real.
      2. scripts/mock_fraudcheck_server.py (Python, proceso independiente) - para probar el
         cliente de forma aislada, simulando un servicio externo real en otro puerto/proceso.
  version: 1.0.0
  contact:
    name: Galaxy Training - Proyecto Final
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Simulador interno (mismo proceso que bank-creditcard-service)
  - url: http://localhost:9090
    description: Mock externo independiente (scripts/mock_fraudcheck_server.py)
tags:
  - name: FraudCheck
    description: Evaluacion de riesgo de fraude para transacciones de tarjeta de credito

paths:
  /internal/fraud-check:
    post:
      operationId: evaluateFraudCheck
      tags: [FraudCheck]
      summary: Evalua el riesgo de fraude de una transaccion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FraudCheckRequest' }
      responses:
        '200':
          description: Evaluacion de riesgo calculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudCheckResponse' }
        '400':
          description: Solicitud invalida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudCheckError' }

components:
  schemas:
    FraudCheckRequest:
      type: object
      required: [cardId, merchant, amount]
      properties:
        cardId:
          type: integer
          format: int64
        merchant:
          type: string
        amount:
          type: number
          description: Monto de la transaccion (BigDecimal en el modelo Java generado).
    FraudCheckResponse:
      type: object
      required: [riskScore]
      properties:
        riskScore:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: >
            Puntaje de riesgo 0-100. Umbrales usados por los simuladores de referencia:
            amount > 3000 -> 90 (alto), amount > 1000 -> 50 (medio), en otro caso -> 10 (bajo).
    FraudCheckError:
      type: object
      properties:
        errorCode: { type: string }
        errorMessage: { type: string }
