name: oms-service-customer
services:
  mysql:
    image: mysql:9.3.0
    container_name: oms-mysql
    environment:
      MYSQL_DATABASE: oms_db_customer
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - oms_mysql_data:/var/lib/mysql

  oms-service-customer:
    build: .
    container_name: oms-service-customer
    depends_on:
      - mysql
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/oms_db_customer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_PROFILES_ACTIVE: docker

volumes:
  oms_mysql_data: