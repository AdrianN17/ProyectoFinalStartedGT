server:
  port: 8081
  servlet:
    context-path: /oms

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/oms_db
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    open-in-view: false

  sql:
    init:
      mode: always

