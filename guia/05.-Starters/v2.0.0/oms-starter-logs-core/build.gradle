plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
//  apply false
group = 'pe.edu.galaxy.training.java'
version = '3.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
}

tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
}


dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    api 'net.logstash.logback:logstash-logback-encoder:8.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "nexus"
            boolean isSnapshot = version.toString().endsWith("SNAPSHOT")
            url = isSnapshot
                    ? "http://localhost:8089/repository/maven-snapshots/"
                    : "http://localhost:8089/repository/maven-releases/"
            allowInsecureProtocol = true
            credentials {
                username = findProperty('nexusUser')
                password = findProperty('nexusPassword')
            }
        }
    }
}
