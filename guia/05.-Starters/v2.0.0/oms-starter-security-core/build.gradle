plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'pe.edu.galaxy.training.java'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure:3.5.6'
    api 'org.springframework.boot:spring-boot-starter-aop:3.5.6'
    api 'org.springframework.boot:spring-boot-starter-json:3.5.6'
    api 'org.springframework.vault:spring-vault-core:3.1.2'
    api 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    implementation "pe.edu.galaxy.training.java:oms-starter-audit-core:1.0.0"

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:3.5.6'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
