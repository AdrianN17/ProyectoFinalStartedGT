plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pe.edu.galaxy.training.java'
version = '3.0.2'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
}

dependencyManagement {
    imports {
        mavenBom "com.azure.spring:spring-cloud-azure-dependencies:7.4.0"
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    api 'org.springframework.boot:spring-boot-starter-json'
    api 'org.springframework.boot:spring-boot-jackson2'
    api 'jakarta.persistence:jakarta.persistence-api'

    api 'com.azure:azure-identity'
    api 'com.azure:azure-security-keyvault-keys'
    api 'com.azure.spring:spring-cloud-azure-starter-keyvault-secrets'

    implementation "pe.edu.galaxy.training.java:oms-starter-audit-core:3.0.2"

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "nexus"
            boolean isSnapshot = version.toString().endsWith("SNAPSHOT")
            url = isSnapshot
                    ? "http://localhost:8089/repository/maven-snapshots/"
                    : "http://localhost:8089/repository/maven-releases/"
            allowInsecureProtocol = true
            credentials {
                username = findProperty('nexusUser')
                password = findProperty('nexusPassword')
            }
        }
    }
}
