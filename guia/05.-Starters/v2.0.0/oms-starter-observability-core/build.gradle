plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'pe.edu.galaxy.training.java'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure:3.5.6'
    api 'org.springframework.boot:spring-boot-starter-actuator:3.5.6'
    api 'org.springframework.boot:spring-boot-starter-aop:3.5.6'

    api 'io.micrometer:micrometer-core:1.15.4'

    api 'io.micrometer:micrometer-registry-prometheus:1.15.4'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:3.5.6'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
