plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pe.edu.galaxy.training.java'
version = '3.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-aspectj'

    api 'io.micrometer:micrometer-core'
    api 'io.micrometer:micrometer-registry-prometheus'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "nexus"
            boolean isSnapshot = version.toString().endsWith("SNAPSHOT")
            url = isSnapshot
                    ? "http://localhost:8089/repository/maven-snapshots/"
                    : "http://localhost:8089/repository/maven-releases/"
            allowInsecureProtocol = true
            credentials {
                username = findProperty('nexusUser')
                password = findProperty('nexusPassword')
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Las versiones de estas dependencias las resuelve io.spring.dependency-management
    // a partir del BOM de Spring Boot/BOM propio; no se fijan explicitamente en este build.gradle.
    suppressedValidationErrors.add('dependencies-without-versions')
}
