services:
  prometheus:
    image: prom/prometheus
    container_name: oms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: oms-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
