// Proyecto unico: microservicio de Tarjeta de Credito que integra, en la misma app,
// los 4 Galaxy Starters (logs, audit, security, observability) y el starter propio
// andes-api-toolkit (server + client, enfoque API-first con OpenAPI).
plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.25.0'
}

group = 'pe.edu.galaxy.training.java.gt'
version = '1.0.0'
description = 'PoC de integracion: Galaxy Starters + andes-api-toolkit con arquitectura hexagonal'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        url 'http://localhost:8089/repository/maven-releases/'
        allowInsecureProtocol = true
        credentials {
            username findProperty('nexusUser')
            password findProperty('nexusPassword')
        }
    }
    mavenCentral()
}

dependencyManagement {
    imports {
        // Requerido para resolver versiones de los artefactos de Azure (Key Vault, Service Bus)
        // usados transitivamente por oms-starter-security-core / oms-starter-audit-core.
        mavenBom "com.azure.spring:spring-cloud-azure-dependencies:7.4.0"
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // BOMs: Galaxy Starters + Andes API Toolkit (Nexus corporativo: maven-releases)
    implementation platform('pe.edu.galaxy.training.java.bom:oms-starter-bom-core:3.0.3')
    implementation platform('pe.andes.api:andes-api-bom:1.0.9')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Galaxy Starters (curso Starter Development)
    implementation 'pe.edu.galaxy.training.java:oms-starter-logs-core'
    implementation 'pe.edu.galaxy.training.java:oms-starter-audit-core'
    implementation 'pe.edu.galaxy.training.java:oms-starter-security-core'
    implementation 'pe.edu.galaxy.training.java:oms-starter-observability-core'

    // Andes API Toolkit (starter propio, curso Java Library Development) — resuelto desde Nexus
    implementation 'pe.andes.api:andes-api-common'
    implementation 'pe.andes.api:andes-api-server-spring-boot-starter'
    implementation 'pe.andes.api:andes-api-client-spring-boot-starter'
    implementation 'pe.andes.api:andes-id-generator-spring-boot-starter'
    implementation 'pe.andes.api:andes-id-generator'
    implementation 'pe.andes.api:andes-text-utils'
    implementation 'io.swagger.core.v3:swagger-models:2.2.22'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-standalone:3.5.4'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Segundo contrato del proyecto (lado cliente): modelos generados desde
// src/main/resources/openapi/openapi-fraudcheck.yaml para la API externa de scoring de fraude que
// FraudCheckClient (andes-api-client-spring-boot-starter) consume. Solo se generan
// los modelos (sin interfaces de API ni documentacion): el transporte HTTP, timeouts,
// correlation id y mapeo de errores los aporta el starter de cliente, no el codigo generado.
openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$projectDir/src/main/resources/openapi/openapi-fraudcheck.yaml"
    outputDir = "$buildDir/generated/openapi"
    modelPackage = 'pe.edu.galaxy.training.java.gt.creditcard.fraud.generated'
    apiPackage = 'pe.edu.galaxy.training.java.gt.creditcard.fraud.generated.api'
    invokerPackage = 'pe.edu.galaxy.training.java.gt.creditcard.fraud.generated.invoker'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    skipOverwrite = false
    globalProperties.set([
            models  : '',
            apis    : 'false',
            supportingFiles: 'false',
    ])
    configOptions.set([
            useBeanValidation: 'false',
            useSpringBoot3   : 'true',
            openApiNullable  : 'false',
            documentationProvider: 'none',
    ])
}

tasks.register('openApiGenerateCreditCardServer', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = 'spring'
    inputSpec = file("$projectDir/src/main/resources/openapi/openapi-creditcard.yaml")
    outputDir = file("$buildDir/generated/openapi-server")
    apiPackage = 'pe.edu.galaxy.training.java.gt.creditcard.generated.server.api'
    modelPackage = 'pe.edu.galaxy.training.java.gt.creditcard.generated.server.model'
    invokerPackage = 'pe.edu.galaxy.training.java.gt.creditcard.generated.server.invoker'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    skipOverwrite = false
    globalProperties.set([
            models         : '',
            apis           : '',
            supportingFiles: 'ApiUtil.java',
    ])
    configOptions.set([
            interfaceOnly     : 'false',
            delegatePattern   : 'true',
            useTags           : 'true',
            useSpringBoot3    : 'true',
            openApiNullable   : 'false',
            documentationProvider: 'none',
    ])
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/openapi/src/main/java"
            srcDir "$buildDir/generated/openapi-server/src/main/java"
        }
    }
}

compileJava.dependsOn tasks.named('openApiGenerate')
compileJava.dependsOn tasks.named('openApiGenerateCreditCardServer')
