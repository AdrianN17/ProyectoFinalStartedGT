openapi: 3.0.3
info:
  title: Fraud Check API
  version: 1.0.0
  description: API externa simulada para validacion anti-fraude.
servers:
  - url: http://localhost:9090
paths:
  /internal/fraud-check:
    post:
      tags: [Fraud]
      operationId: evaluateFraud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraudCheckRequest'
      responses:
        '200':
          description: Resultado del fraude
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCheckResponse'
components:
  schemas:
    FraudCheckRequest:
      type: object
      required: [cardId, merchant, amount]
      properties:
        cardId:
          type: integer
          format: int64
        merchant:
          type: string
        amount:
          type: number
          format: double
    FraudCheckResponse:
      type: object
      required: [riskScore]
      properties:
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
