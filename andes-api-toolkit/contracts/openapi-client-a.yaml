openapi: 3.0.3
info:
  title: Orders API (External - Client A)
  description: >
    Contrato de una API externa de ordenes consumida por el PoC Client.
    Usa un envelope de respuesta simple (sin el ApiResponse estandar de Andes),
    para demostrar que andes-api-client puede adaptarse a contratos ajenos.
  version: 2.3.0
servers:
  - url: http://localhost:8082
    description: Partner production server
paths:
  /v2/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retrieve an order by id
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerError'
  /v2/orders:
    post:
      operationId: createOrder
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerError'
components:
  schemas:
    Order:
      type: object
      properties:
        orderId: { type: string }
        customerId: { type: integer, format: int64 }
        totalAmount: { type: number, format: double }
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      properties:
        sku: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: double }
    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: integer, format: int64 }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    # Note: this partner uses its own error shape, different from Andes ApiError.
    # AndesClientErrorMapper falls back to a generic message when it cannot parse
    # the body as an Andes ApiError, so this remains fully supported.
    PartnerError:
      type: object
      properties:
        errorCode: { type: string }
        errorMessage: { type: string }
        timestamp: { type: string, format: date-time }
