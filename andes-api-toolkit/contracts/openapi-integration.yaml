openapi: 3.0.3
info:
  title: Andes Integration PoC - Checkout API
  description: >
    API propia expuesta por el PoC Integration. Internamente delega en la libreria Client
    (andes-api-client) para colocar la orden en la Orders API externa
    (ver contracts/openapi-client-a.yaml), demostrando el flujo:
    Own API -> Business logic -> Client Library -> Remote API -> Standardized response.
  version: 1.0.0
  contact:
    name: Andes API Toolkit Team
    email: support@andes.pe
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8083
    description: Local development server
tags:
  - name: Checkouts
    description: Own checkout API backed internally by an external Orders API
paths:
  /api/v1/checkouts:
    post:
      operationId: createCheckout
      tags: [Checkouts]
      summary: Place a checkout, which internally creates an order in the external Orders API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/checkouts/{orderId}:
    get:
      operationId: getCheckout
      tags: [Checkouts]
      summary: Retrieve a previously placed checkout by its remote order id
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Checkout found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutEnvelope'
        '404':
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    CheckoutItem:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: double }
    CheckoutRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: integer, format: int64 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItem'
    CheckoutResult:
      type: object
      properties:
        orderId: { type: string }
        customerId: { type: integer, format: int64 }
        totalAmount: { type: number, format: double }
        status: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
    CheckoutEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/CheckoutResult'
        error:
          nullable: true
          $ref: '#/components/schemas/ApiError'
        metadata:
          $ref: '#/components/schemas/ApiMetadata'
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true }
        error:
          $ref: '#/components/schemas/ApiError'
        metadata:
          $ref: '#/components/schemas/ApiMetadata'
    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        httpStatus: { type: integer }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
    ApiErrorDetail:
      type: object
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
        rejectedValue: { nullable: true }
    ApiMetadata:
      type: object
      properties:
        traceId: { type: string }
        correlationId: { type: string }
        requestId: { type: string }
        apiVersion: { type: string }
        timestamp: { type: string, format: date-time }
