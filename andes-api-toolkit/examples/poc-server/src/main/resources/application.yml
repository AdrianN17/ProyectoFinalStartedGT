server:
  port: 8080

spring:
  application:
    name: poc-server

andes:
  api:
    server:
      correlation:
        enabled: true
        generate-if-missing: true
      response:
        # The generated CustomersApi controller already returns the full Andes envelope
        # (CustomerEnvelope/CustomerPageEnvelope), so auto-wrapping must stay OFF here to
        # avoid double-wrapping the response body.
        wrap-enabled: false
      error-handling:
        enabled: true
        include-stack-trace: false
      openapi:
        enabled: true
        title: Andes Customer API
        description: PoC Server - Customers API (see contracts/openapi-server.yaml)
        version: 1.0.0
        contact:
          name: Andes API Toolkit Team
          email: support@andes.pe
        license:
          name: Apache 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.html
        servers:
          - url: http://localhost:8080
            description: Local development server
        tags:
          - name: Customers
            description: Operations about customers
        security-schemes:
          bearerAuth:
            type: http
            scheme: bearer
            bearer-format: JWT

logging:
  level:
    pe.andes: DEBUG
